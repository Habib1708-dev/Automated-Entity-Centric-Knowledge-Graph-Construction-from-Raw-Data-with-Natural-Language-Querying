[project]
name = "kgbuilder"
version = "0.1.0"
description = "Automated knowledge graph construction from CSV and text"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "neo4j>=5.20",
    "google-genai>=1.0",
    "httpx>=0.27",  # the Ollama adapter talks HTTP directly
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "mlflow>=2.16",
    "pypdf>=4.0",
    "psycopg[binary]>=3.2",  # PostgreSQL as a source of tables (R114); binary: no local libpq needed
]

[project.scripts]
kg = "kgbuilder.cli:app"

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pytest>=8",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgbuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "neo4j: needs a running Neo4j (docker compose up -d); skipped when it is down",
    "postgres: needs the test PostgreSQL (docker compose up -d postgres-test); skipped when it is down",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP modern syntax, SIM simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
