# Model presets: named sets of settings for the three kinds of run.
#
# Choose one per command with `uv run kg --preset <name> ...`, or as a default with KG_PRESET=<name> in .env.
# Priority: a variable set in the terminal > the preset > .env > the defaults in config.py, so a preset
# replaces the model lines of .env, and one value can still be overridden for a single run.
# Keys are Settings fields (see src/kgbuilder/config.py); an unknown key or preset is an error, not ignored.
# Never put an API key here: this file is committed.
# smoke and dev read a small committed subset of data/ (samples/), quality the whole dataset.

# Free check that the code runs end to end, on a tiny subset (one product, three reviews: about 10 LLM
# requests). Uses GEMINI_FREE_API_KEY, a key from a Google project without billing: $0, but capped per day,
# which also keeps smoke runs rare. The graph it produces says nothing about quality.
smoke:
  description: gemini-3.5-flash-lite on the free key, samples/smoke, $0
  llm_provider: gemini
  gemini_key: free
  schema_model: gemini-3.5-flash-lite
  extract_model: gemini-3.5-flash-lite
  embed_model: gemini-embedding-001
  data_dir: samples/smoke
  mlflow_experiment: kgbuilder-smoke

# Cheap check with real Gemini behaviour on the paid key (API errors, schemas, tracking), on a subset of
# three products. Flash-Lite does not think, which is where the cost of Flash goes. On the whole of data/
# it cost $0.06 (2026-09-22); the subset needs about a third of that. Not for reported results.
dev:
  description: gemini-3.5-flash-lite everywhere, samples/dev, about 2 cents per run
  llm_provider: gemini
  gemini_key: paid
  schema_model: gemini-3.5-flash-lite
  extract_model: gemini-3.5-flash-lite
  embed_model: gemini-embedding-001
  data_dir: samples/dev
  mlflow_experiment: kgbuilder-dev

# Genuine quality and performance runs: the numbers reported in the thesis come from this preset only.
# The stronger model designs the plan and the text schema; Flash extracts per chunk. Measured on data/
# (2026-09-22): $1.25 per run, $1.05 of it Flash thinking during extraction.
quality:
  description: gemini-3.1-pro-preview for schema work + gemini-3.8-flash for extraction
  llm_provider: gemini
  gemini_key: paid
  schema_model: gemini-3.1-pro-preview
  extract_model: gemini-3.8-flash
  embed_model: gemini-embedding-001
  data_dir: data
  mlflow_experiment: kgbuilder
